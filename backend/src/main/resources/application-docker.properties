# Docker: API слушает все интерфейсы внутри сети compose (nginx → api:8080).
server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework

# HTTPS на edge (my.ruc.su): Secure cookie
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# PostgreSQL (сервис db в docker-compose). Переопределяется env SPRING_DATASOURCE_*.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/ruk_lk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ruk_lk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ruk_lk}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

# Фото пропусков на volume ./data:/app/data
app.pass-photo.storage-dir=/app/data/pass-photos
