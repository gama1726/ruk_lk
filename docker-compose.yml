services:
  api:
    build:
      context: ./backend
    container_name: ruk-lk-api
    restart: unless-stopped
    volumes:
      - ./backend/application-local.properties:/app/application-local.properties:ro
      - ./data:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: onec,prod,docker
    # Внутренний DNS: new.ruc.su → 10.10.21.7 (публичный 195.x из Docker часто недоступен)
    extra_hosts:
      - "new.ruc.su:10.10.21.7"
    networks:
      - ruk-lk

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: ruk-lk-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - ruk-lk

networks:
  ruk-lk:
    driver: bridge
