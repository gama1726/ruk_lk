# Пример внешнего nginx на хосте для https://my.ruc.su
# TLS на хосте → прокси на Docker web (127.0.0.1:80).
#
# Сертификаты: certbot / уже выданные для my.ruc.su
# После правок: nginx -t && systemctl reload nginx

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name my.ruc.su;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name my.ruc.su;

    # ssl_certificate     /etc/letsencrypt/live/my.ruc.su/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/my.ruc.su/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Security headers на edge
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Важно для Spring session / cookie.secure и логов
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
